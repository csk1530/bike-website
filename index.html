<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Bikes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>🏍️ Modern Bikes Gallery</h1>
</header>

<section class="bike-container">

  <div class="bike-card">
    <img src="https://source.unsplash.com/400x300/?sports-bike" alt="Bike">
    <h2>Sports Bike</h2>
    <button onclick="showAlert('Sports Bike')">View</button>
  </div>

  <div class="bike-card">
    <img src="https://source.unsplash.com/400x300/?cruiser-bike" alt="Bike">
    <h2>Cruiser Bike</h2>
    <button onclick="showAlert('Cruiser Bike')">View</button>
  </div>

  <div class="bike-card">
    <img src="https://source.unsplash.com/400x300/?electric-bike" alt="Bike">
    <h2>Electric Bike</h2>
    <button onclick="showAlert('Electric Bike')">View</button>
  </div>

</section>

<script src="script.js"></script>
</body>
</html>
